name: Publicar prévia no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: withastro/action@v6
        with:
          node-version: 24
        env:
          ASTRO_BASE_PATH: /dr-felipe-bicudo
          ASTRO_SITE_URL: https://a-bps.github.io
          ASTRO_TELEMETRY_DISABLED: '1'
      - uses: actions/deploy-pages@v5
        id: deployment